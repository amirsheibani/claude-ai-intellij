<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClaudeFA</title>
  <style>
/*__CSS__*/
  </style>
</head>
<body>
  <!-- chat tabs (one Claude process per tab) -->
  <header id="topbar">
    <div class="tabs" id="chatTabs"></div>
    <div class="actions">
      <button id="btnNewChat" class="icon" title="گفتگوی جدید">＋</button>
      <button id="btnSettings" class="icon" title="تنظیمات">⚙</button>
    </div>
  </header>
  <!-- per-chat sub tabs: main chat + subagents -->
  <nav id="subTabs" class="subtabs"></nav>

  <main id="views">
    <section id="view-chat" class="view">
      <div id="searchBar" class="searchbar hidden">
        <input id="searchInput" placeholder="جستجو در گفتگو… (Enter: بعدی)" dir="auto">
        <button id="searchPrev" class="icon" title="قبلی">↑</button>
        <button id="searchNext" class="icon" title="بعدی">↓</button>
        <button id="searchClose" class="icon" title="بستن">✕</button>
      </div>
      <div id="chatLogs"></div>
    </section>
    <section id="view-workloads" class="view hidden"></section>
    <section id="view-git" class="view hidden"></section>
    <section id="view-guard" class="view hidden"></section>
    <section id="view-vulns" class="view hidden"></section>
    <section id="view-log" class="view hidden"></section>
    <section id="view-session" class="view hidden"></section>
  </main>

  <div id="status" class="status hidden">
    <span class="spin" id="spin">✻</span><span id="statusText">در حال فکر کردن…</span>
    <span class="hint" id="statusHint"></span>
  </div>

  <section id="info" class="info" dir="ltr">
    <div class="limits" id="infoLimits"></div>
    <div><span class="k">Model:</span> <span class="v" id="infoModel">—</span></div>
    <div class="wide"><span class="k">Working dir:</span> <span class="v" id="infoCwd">—</span></div>
    <div><span class="k">Account:</span> <span class="v" id="infoAccount">—</span></div>
    <div><span class="k">Plan:</span> <span class="v" id="infoPlan">—</span></div>
    <div><span class="k">Provider:</span> <span class="v" id="infoProvider">—</span></div>
    <div><span class="state" id="infoState"><span class="sdot"></span><span id="infoStateText">Idle</span></span></div>
    <div><span class="k">Context</span> <span class="bar"><span id="infoCtxBar"></span></span> <span class="v" id="infoCtx">0%</span></div>
    <div><span class="v" id="infoOut">0</span> <span class="k">out</span> · <span class="v" id="infoReason">0</span> <span class="k">reasoning</span></div>
    <div><span class="k">Cost</span> <span class="v" id="infoCost">$0.00</span></div>
  </section>

  <div id="mention" class="popup hidden" dir="ltr"></div>
  <div id="slash" class="popup hidden" dir="ltr"></div>

  <footer id="composer">
    <div class="card">
      <div class="ctabs">
        <div class="tabrow" id="viewTabs">
          <button class="vt active" data-view="chat">گفتگو</button>
          <button class="vt" data-view="workloads">کارها</button>
          <button class="vt" data-view="git">Git</button>
          <button class="vt" data-view="guard">محافظ</button>
          <button class="vt" data-view="vulns">آسیب‌پذیری‌ها</button>
          <button class="vt" data-view="log">لاگ</button>
          <button class="vt" data-view="session">نشست</button>
        </div>
        <div class="tabicons">
          <button id="btnNewChat2" class="icon" title="گفتگوی جدید">＋</button>
          <button id="btnSearch" class="icon" title="جستجو در گفتگو">⌕</button>
          <button id="btnGit" class="icon" title="Git">⎇</button>
          <button id="btnMore" class="icon" title="بیشتر">⋮</button>
        </div>
      </div>
      <textarea id="input" dir="auto" rows="2" placeholder="از Claude بپرسید، یا / برای دستورها و @ برای فایل‌ها"></textarea>
      <div class="toolbar">
        <div class="group">
          <button id="btnAttach" class="tb" title="افزودن فایل، پوشه یا تصویر">📎</button>
          <span class="sep"></span>
          <button id="ddModel" class="tb dd" title="مدل"><span class="ic">⚙</span><span class="lbl" dir="ltr"></span><span class="car">▾</span></button>
          <span class="sep"></span>
          <button id="ddMode" class="tb dd" title="حالت دسترسی (Shift+Tab)"><span class="ic">🛡</span><span class="lbl"></span><span class="car">▾</span></button>
          <span class="sep"></span>
          <button id="ddEffort" class="tb dd" title="میزان تلاش (effort)"><span class="ic">◠</span><span class="lbl" dir="ltr"></span><span class="car">▾</span></button>
        </div>
        <div class="group">
          <button id="ctxChip" class="chip hidden" title=""></button>
          <button id="btnGuard" class="tb guard" title="محافظ (Guard)">⛨</button>
          <button id="btnMore2" class="tb" title="بیشتر">⋮</button>
          <button id="btnSend" class="send" title="ارسال (Enter)">➤</button>
          <button id="btnStop" class="stop hidden" title="توقف (Esc)">■</button>
        </div>
      </div>
    </div>
  </footer>

  <div id="menu" class="menu hidden"></div>

  <template id="tplWelcome">
    <div class="welcome-wrap">
      <div class="welcome">
        <div class="title"><svg class="logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M4.709 15.955l4.72-2.647.08-.23-.08-.128H9.2l-.79-.048-2.698-.073-2.339-.097-2.266-.122-.571-.121L0 11.784l.055-.352.48-.321.686.06 1.52.103 2.278.158 1.652.097 2.449.255h.389l.055-.157-.134-.098-.103-.097-2.358-1.596-2.552-1.688-1.336-.972-.724-.491-.364-.462-.158-1.008.656-.722.881.06.225.061.893.686 1.908 1.476 2.491 1.833.365.304.145-.103.019-.073-.164-.274-1.355-2.446-1.446-2.49-.644-1.032-.17-.619a2.97 2.97 0 01-.104-.729L6.283.134 6.696 0l.996.134.42.364.62 1.414 1.002 2.229 1.555 3.03.456.898.243.832.091.255h.158V9.01l.128-1.706.237-2.095.23-2.695.08-.76.376-.91.747-.492.584.28.48.685-.067.444-.286 1.851-.559 2.903-.364 1.942h.212l.243-.242.985-1.306 1.652-2.064.73-.82.85-.904.547-.431h1.033l.76 1.129-.34 1.166-1.064 1.347-.881 1.142-1.264 1.7-.79 1.36.073.11.188-.02 2.856-.606 1.543-.28 1.841-.315.833.388.091.395-.328.807-1.969.486-2.309.462-3.439.813-.042.03.049.061 1.549.146.662.036h1.622l3.02.225.79.522.474.638-.079.485-1.215.62-1.64-.389-3.829-.91-1.312-.329h-.182v.11l1.093 1.068 2.006 1.81 2.509 2.33.127.578-.322.455-.34-.049-2.205-1.657-.851-.747-1.926-1.62h-.128v.17l.444.649 2.345 3.521.122 1.08-.17.353-.608.213-.668-.122-1.374-1.925-1.415-2.167-1.143-1.943-.14.08-.674 7.254-.316.37-.729.28-.607-.461-.322-.747.322-1.476.389-1.924.315-1.53.286-1.9.17-.632-.012-.042-.14.018-1.434 1.967-2.18 2.945-1.726 1.845-.414.164-.717-.37.067-.662.401-.589 2.388-3.036 1.44-1.882.93-1.086-.006-.158h-.055L4.132 18.56l-1.13.146-.487-.456.061-.746.231-.243 1.908-1.312-.006.006z" fill="#D97757" fill-rule="nonzero"></path></svg>به <b>ClaudeFA</b> خوش آمدید!</div>
        <div class="cwd"></div>
      </div>
      <div class="tips">
        <div>نکته‌هایی برای شروع:</div>
        <ol>
          <li>سؤال بپرسید، کد را ویرایش کنید یا دستور اجرا کنید — به فارسی.</li>
          <li>با <kbd>@</kbd> به فایل‌ها و با <kbd>/</kbd> به دستورها دسترسی دارید.</li>
          <li>تغییرات پیشنهادی در Diff Viewer نمایش داده می‌شوند تا بپذیرید یا رد کنید.</li>
          <li><kbd>Shift+Tab</kbd> حالت دسترسی را عوض می‌کند، <kbd>Esc</kbd> پاسخ را متوقف می‌کند.</li>
        </ol>
        <button class="sugg">ساختار این پروژه را توضیح بده</button>
        <button class="sugg">باگ‌های احتمالی کد را پیدا کن</button>
        <button class="sugg">برای این پروژه یک README فارسی بنویس</button>
      </div>
    </div>
  </template>

  <script>
/*__JS__*/
  </script>
</body>
</html>
